version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    allow:
      - dependency-type: all
    groups:
      go-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
