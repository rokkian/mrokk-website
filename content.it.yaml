      description: Progetto Matlab per calcolare parametri caratteristici di file audio WAV e confrontare suoni diversi. Le caratteristiche includono tempo di attacco, attraversamenti dello zero, brillantezza, irregolarità dello spettro e componenti spettrali pari e dispari nei domini del tempo e della frequenza.
      tags: [Matlab, Elaborazione digitale dei segnali]
