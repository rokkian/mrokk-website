about:
  label: Profilo
  title: Ingegnere cloud e dati, sempre pronto a imparare.
  text: Progetto e realizzo infrastrutture cloud e piattaforme dati, con particolare attenzione a Google Cloud, Terraform, BigQuery, Dataform, Dataplex, Python e PySpark. Ho lavorato su analisi dei dati per la pubblica amministrazione, infrastrutture per le telecomunicazioni, previsioni in ambito energetico, pagamenti fintech, machine learning e piattaforme dati per l'IA. Ho inoltre conseguito le certificazioni Google Cloud Professional Cloud Architect e Professional Machine Learning Engineer.

experience:
  label: Esperienza
  intro: I ruoli e le realtà che hanno formato il mio percorso.
  entries:
    - period: Giugno 2024 — Presente
      role: Ingegnere cloud e dati
      company: Datwave
      location: Milano/Remoto
      description: |
        Attività di ingegneria cloud, ingegneria dei dati e sviluppo di piattaforme per l'IA:
        - Progettazione di un'architettura dati per l'analisi con BigQuery, Dataform e Dataplex per un ente pubblico regionale italiano.
        - Sviluppo di architetture cloud e infrastrutture come codice con Terraform.
        - Sviluppo e provisioning di infrastrutture Google Cloud e moduli Terraform personalizzati per un'azienda svizzera di telecomunicazioni.
        - Realizzazione di una prova di fattibilità per estrarre metadati di tracciabilità dei dati da codice legacy COBOL e SAS con Google Cloud, Python, LangChain e Podman.
        - Progettazione di una piattaforma dati per fornire a chatbot di assistenza clienti basati sull'IA dati contestuali da sistemi esterni batch e in tempo reale, con Google Cloud, Python, BigQuery e Terraform.
    - period: Maggio 2022 — Giugno 2024
      role: Ingegnere cloud e dati junior
      company: BIP
      location: Bologna/Remoto
      description: |
        Progetti sui dati per la gestione dell'energia e i pagamenti fintech:
        - Manutenzione di flussi dati per il mercato dell'energia e le attività aziendali con Python e PySpark su Cloudera e Azure Databricks.
        - Preparazione e analisi di dati sulle materie prime energetiche con Python, Pandas e Polars.
        - Manutenzione e sviluppo di report e prodotti di business intelligence con notebook Python e Microsoft Excel.
        - Manutenzione e sviluppo di flussi dati fintech con PySpark, distribuiti ed eseguiti tramite Tuber e Airflow su cluster Kubernetes e Spark on-premise.
    - period: Ottobre 2021 — Aprile 2022
      role: Sviluppatore software e analista dati junior
      company: PLANNET S.r.l.
      location: Reggio Emilia
      description: |
        Progettazione e sviluppo di un sistema di machine learning per prevedere serie temporali della produzione industriale, realizzazione di pipeline di elaborazione dei dati per la preparazione dei modelli e creazione e manutenzione di report Power BI sui dati storici di produzione.
    - period: Giugno 2021 — Luglio 2021
      role: Analista di contenuti
      company: Majorel
      location: Cracovia/Remoto
      description: Analisi di siti web per verificarne la conformità alle norme di Google Search Ads.
    - period: Maggio 2019 — Ottobre 2019
      role: Stagista amministratore IT
      company: Stars & Cows
      location: Fiorano Modenese
      description: Gestione e manutenzione delle infrastrutture e delle risorse informatiche dell'ufficio, configurazione di sistemi e integrazioni software e contributi allo sviluppo web.

