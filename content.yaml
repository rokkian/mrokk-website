about:
  label: 01 / About
  title: Cloud engineer, data engineer, and lifelong learner.
  text: I design and build cloud infrastructures and data platforms, with a focus on Google Cloud, Terraform, BigQuery, Dataform, Dataplex, Python, and PySpark. My experience spans public-sector analytics, telecommunications infrastructure, energy forecasting, fintech payments, machine learning, and AI data platforms. I am also a Google Cloud Certified Professional Cloud Architect and Professional Machine Learning Engineer.

experience:
  label: 02 / Experience
  intro: The places and roles that shaped me.
  entries:
    - period: June 2024 — Present
      role: Cloud & Data Engineer
      company: Datwave
      location: Milan/Remote
      description: |
        Working across cloud engineering, data engineering, and AI platform development:
        - Designed analytics data architecture for an Italian regional government agency with BigQuery, Dataform, and Dataplex.
        - Developed cloud architecture and infrastructure-as-code with Terraform.
        - Developed and provisioned Google Cloud infrastructure and customer-specific Terraform modules for a Swiss telecommunications company.
        - Built a proof of concept for extracting data-lineage metadata from legacy COBOL and SAS codebases with Google Cloud, Python, LangChain, and Podman.
        - Designed a data platform to provide customer-assistance AI chatbots with contextual data from batch and real-time external systems, using Google Cloud, Python, BigQuery, and Terraform.
    - period: May 2022 — June 2024
      role: Junior Cloud & Data Engineer
      company: BIP
      location: Bologna/Remote
      description: |
        Worked on energy-management and fintech-payments data projects:
        - Maintained energy-retail and business data workflows with Python and PySpark on Cloudera and Azure Databricks.
        - Prepared and analyzed energy-commodity data with Python, Pandas, and Polars.
        - Maintained and developed data reports and BI products with Python notebooks and Microsoft Excel.
        - Maintained and developed fintech data workflows with PySpark, deploying and executing them through Tuber and Airflow on on-premise Kubernetes and Spark clusters.
    - period: October 2021 — April 2022
      role: Junior Software Developer and Data Analyst
      company: PLANNET S.r.l.
      location: Reggio Emilia
      description: |
        Designed and developed a machine-learning system to forecast industrial production time series, built data-processing pipelines for model preparation, and created and maintained Power BI reports for historical production data.
    - period: June 2021 — July 2021
      role: Content Analyst
      company: Majorel
      location: Kraków/Remote
      description: Analyzed websites for compliance with Google Search Ads policies.
    - period: May 2019 — October 2019
      role: IT Administrator Intern
      company: Stars & Cows
      location: Fiorano Modenese
      description: Managed and maintained office infrastructure and assets, set up office systems and software integrations, and contributed to web development.

