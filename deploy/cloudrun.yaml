apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: mrokk-web
  annotations:
    # Accept requests from the public internet. Authentication is configured
    # separately with the gcloud IAM command in README.md.
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # A personal site can scale to zero when nobody is visiting it.
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - name: web
          # Replace PROJECT_ID with your Google Cloud project ID.
          image: europe-west1-docker.pkg.dev/pinebula/personal-site/mrokk-web:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 256Mi
