{{define "blog-post.html"}}
<!doctype html>
<html lang="{{.Language}}" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{.Post.Summary}}">
  <meta name="theme-color" content="#263e37">
  <title>{{.Content.SiteName}} — {{.Post.Title}}</title>
  {{template "site-assets" .}}
  <link rel="alternate" type="application/rss+xml" title="{{.Content.SiteName}} — RSS" href="{{.URL "/blog/feed.xml"}}">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">{{.Content.UI.skip_content}}</a>
  <div class="site-page">
  {{template "site-header" .}}

  <main tabindex="-1" id="main-content" class="inner-page">
    <article class="post-page">
      <div class="post-toolbar"><a class="back-link" href="{{.URL "/blog"}}"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 12H5m6-6-6 6 6 6"/></svg>{{.Content.UI.all_posts}}</a>
      <div class="post-meta"><p>{{.Date .Post.Date}}</p><div class="tags">{{range .Post.Tags}}<span>{{.}}</span>{{end}}</div></div>
      </div>
      <div class="post-body">{{.Post.HTML}}</div>
    </article>
  </main>

  {{template "site-footer" .}}
  </div>
</body>
</html>
{{end}}
