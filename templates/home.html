{{define "home.html"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{.Content.MetaDescription}}">
  <meta name="theme-color" content="#f4f5ef">
  <title>{{.Content.SiteName}} — {{.Content.Hero.Title}}</title>
  <link rel="icon" type="image/png" href="/static/images/favicon.png">
  <link rel="alternate" type="application/rss+xml" title="{{.Content.SiteName}} RSS Feed" href="/blog/feed.xml">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="/">{{.Content.SiteName}}<span>.</span></a>
    <nav aria-label="Primary navigation">
      <a href="/me">CV</a>
      <a href="/blog">{{.Content.Navigation.Blog}}</a>
      <a href="/contacts">Contacts</a>
      <button class="theme-toggle" type="button" aria-label="{{.Content.Theme.DarkLabel}}" data-light-label="{{.Content.Theme.LightLabel}}" data-dark-label="{{.Content.Theme.DarkLabel}}" aria-pressed="false">
        <span class="sun" aria-hidden="true">☼</span><span class="moon" aria-hidden="true">☾</span>
      </button>
    </nav>
  </header>

  <main class="landing-page">
    <section class="landing-intro">
      <p class="eyebrow">{{.Content.Hero.Eyebrow}}</p>
      <h1>{{.Content.Hero.Title}}</h1>
      <p class="intro">{{.Content.Hero.Intro}}</p>
      <div class="landing-actions">
        <a class="button" href="/me">View my CV <span>↗</span></a>
        <a class="text-link" href="/blog">Read the blog <span>↗</span></a>
      </div>
    </section>
  </main>

  {{template "site-footer" .}}
  <script src="/static/theme.js"></script>
</body>
</html>
{{end}}
